# Configuración para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT para pruebas
jwt.secret=mySecretKey1234567890mySecretKey1234567890mySecretKey1234567890
jwt.expirationMs=86400000

# Deshabilitiar actuadores en pruebas
management.endpoints.web.exposure.include=health

# Logging para pruebas
logging.level.com.udea.AnalisisFinanciero_back=DEBUG
logging.level.org.springframework.security=DEBUG

# Configuración Swagger para tests
swagger.server.url=http://localhost:8080